name: bmi_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  google_fonts: ^8.2.1
  fl_chart: ^1.2.0
  shared_preferences: ^2.5.5
  lottie: ^3.3.3
  intl: ^0.20.3
  pdf: ^3.12.0
  path_provider: ^2.1.6
  share_plus: ^13.3.0
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  google_sign_in: 6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/animations/
    - assets/images/
